version: "2"

linters:
  # standard set (errcheck, govet, ineffassign, staticcheck, unused) plus:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  exclusions:
    paths:
      - web # node_modules ships stray .go files
    rules:
      # Fixture files and temp dirs in tests don't need locked-down modes.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - web
